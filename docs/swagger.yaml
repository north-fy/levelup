basePath: /api/v1
definitions:
  domain.Branch:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.Purchase:
    properties:
      buyer_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      price:
        type: integer
      seller_id:
        type: integer
    type: object
  domain.Quest:
    properties:
      branch_id:
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      duration_hours:
        type: integer
      id:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      started_at:
        type: string
      status:
        $ref: '#/definitions/domain.QuestStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.QuestType'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.QuestStatus:
    enum:
    - todo
    - in_progress
    - done
    - cancelled
    type: string
    x-enum-varnames:
    - QuestStatusTodo
    - QuestStatusInProgress
    - QuestStatusDone
    - QuestStatusCancelled
  domain.QuestType:
    enum:
    - simple
    - timed
    type: string
    x-enum-varnames:
    - QuestTypeSimple
    - QuestTypeTimed
  domain.Roadmap:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      source_id:
        type: integer
      source_type:
        $ref: '#/definitions/domain.RoadmapSourceType'
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.RoadmapDetail:
    properties:
      created_at:
        type: string
      description:
        type: string
      edges:
        items:
          $ref: '#/definitions/domain.RoadmapEdge'
        type: array
      id:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/domain.RoadmapNode'
        type: array
      source_id:
        type: integer
      source_type:
        $ref: '#/definitions/domain.RoadmapSourceType'
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.RoadmapEdge:
    properties:
      from_node_id:
        type: integer
      id:
        type: integer
      roadmap_id:
        type: integer
      to_node_id:
        type: integer
    type: object
  domain.RoadmapNode:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      duration_hours:
        type: integer
      id:
        type: integer
      position:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      roadmap_id:
        type: integer
      status:
        $ref: '#/definitions/domain.QuestStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.QuestType'
      updated_at:
        type: string
    type: object
  domain.RoadmapSourceType:
    enum:
    - own
    - workshop
    type: string
    x-enum-varnames:
    - RoadmapSourceOwn
    - RoadmapSourceWorkshop
  domain.ShopItem:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      price_gold:
        type: integer
      seller_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  domain.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      gold:
        type: integer
      id:
        type: integer
      level:
        type: integer
      nickname:
        type: string
      status:
        type: string
      updated_at:
        type: string
      xp:
        type: integer
    type: object
  domain.WorkshopRoadmap:
    properties:
      author_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_published:
        type: boolean
      source_roadmap_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.addNodeRequest:
    properties:
      dependencies:
        items:
          type: integer
        type: array
      description:
        type: string
      duration_hours:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      title:
        type: string
      type:
        $ref: '#/definitions/domain.QuestType'
    required:
    - title
    - type
    type: object
  handlers.createBranchRequest:
    properties:
      color:
        type: string
      description:
        type: string
      icon:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.createQuestRequest:
    properties:
      description:
        type: string
      duration_hours:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      title:
        type: string
      type:
        $ref: '#/definitions/domain.QuestType'
    required:
    - title
    - type
    type: object
  handlers.createRoadmapRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handlers.createShopItemRequest:
    properties:
      description:
        type: string
      price_gold:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  handlers.createWorkshopRequest:
    properties:
      description:
        type: string
      roadmap_id:
        type: integer
      title:
        type: string
    required:
    - roadmap_id
    type: object
  handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.logoutRequest:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      nickname:
        maxLength: 64
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - nickname
    - password
    type: object
  handlers.tokenResponse:
    properties:
      access_expires_at:
        type: integer
      access_token:
        type: string
      refresh_expires_at:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  handlers.updateBranchRequest:
    properties:
      color:
        type: string
      description:
        type: string
      icon:
        type: string
      name:
        type: string
    type: object
  handlers.updateNodeRequest:
    properties:
      dependencies:
        items:
          type: integer
        type: array
      description:
        type: string
      duration_hours:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      title:
        type: string
    type: object
  handlers.updateProfileRequest:
    properties:
      avatar_url:
        type: string
      nickname:
        type: string
      status:
        type: string
    type: object
  handlers.updateQuestRequest:
    properties:
      description:
        type: string
      duration_hours:
        type: integer
      reward_gold:
        type: integer
      reward_xp:
        type: integer
      title:
        type: string
    type: object
  handlers.updateRoadmapRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  handlers.updateShopItemRequest:
    properties:
      description:
        type: string
      price_gold:
        type: integer
      title:
        type: string
    type: object
  handlers.updateWorkshopRequest:
    properties:
      description:
        type: string
      is_published:
        type: boolean
      title:
        type: string
    type: object
  services.BranchStat:
    properties:
      branch_id:
        type: integer
      completed:
        type: integer
      gold:
        type: integer
      hours:
        type: integer
      xp:
        type: integer
    type: object
  services.OverviewStats:
    properties:
      gold:
        type: integer
      hours:
        type: integer
      level:
        type: integer
      xp:
        type: integer
    type: object
  services.QuestStat:
    properties:
      completed:
        type: integer
      date:
        type: string
      gold:
        type: integer
      hours:
        type: integer
      xp:
        type: integer
    type: object
  services.RoadmapStat:
    properties:
      completed:
        type: integer
      gold:
        type: integer
      hours:
        type: integer
      roadmap_id:
        type: integer
      xp:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'RPG-style task tracker: quests, gold, roadmaps and stats.'
  title: LevelUp Tracker API
  version: "1.0"
paths:
  /auth/github/callback:
    get:
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Handle the GitHub OAuth callback
      tags:
      - auth
  /auth/github/redirect:
    get:
      produces:
      - text/plain
      responses:
        "302":
          description: Found
      summary: Redirect the user to GitHub for OAuth
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tokens to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.logoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Revoke the current tokens
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Rotate a refresh token into a new token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /branches:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Branch'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the user's branches
      tags:
      - branches
    post:
      consumes:
      - application/json
      parameters:
      - description: Branch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createBranchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Branch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a branch
      tags:
      - branches
  /branches/{branch_id}/quests:
    get:
      parameters:
      - description: Branch id
        in: path
        name: branch_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Quest'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List quests in a branch
      tags:
      - quests
    post:
      consumes:
      - application/json
      parameters:
      - description: Branch id
        in: path
        name: branch_id
        required: true
        type: integer
      - description: Quest payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createQuestRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Quest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a quest in a branch
      tags:
      - quests
  /branches/{id}:
    delete:
      parameters:
      - description: Branch id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a branch
      tags:
      - branches
    get:
      parameters:
      - description: Branch id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Branch'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a branch by id
      tags:
      - branches
    patch:
      consumes:
      - application/json
      parameters:
      - description: Branch id
        in: path
        name: id
        required: true
        type: integer
      - description: Branch fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateBranchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Branch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a branch
      tags:
      - branches
  /quests/{id}:
    delete:
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a quest
      tags:
      - quests
    get:
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a quest by id
      tags:
      - quests
    patch:
      consumes:
      - application/json
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      - description: Quest fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateQuestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a quest
      tags:
      - quests
  /quests/{id}/complete:
    post:
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete a simple quest and claim its reward
      tags:
      - quests
  /quests/{id}/start:
    post:
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start the time tracker of a timed quest
      tags:
      - quests
  /quests/{id}/stop:
    post:
      parameters:
      - description: Quest id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stop the time tracker and complete the timed quest
      tags:
      - quests
  /roadmaps:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Roadmap'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the user's roadmaps
      tags:
      - roadmaps
    post:
      consumes:
      - application/json
      parameters:
      - description: Roadmap payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createRoadmapRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Roadmap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a personal roadmap
      tags:
      - roadmaps
  /roadmaps/{id}:
    delete:
      parameters:
      - description: Roadmap id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a roadmap
      tags:
      - roadmaps
    get:
      parameters:
      - description: Roadmap id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.RoadmapDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a roadmap with its graph
      tags:
      - roadmaps
    patch:
      consumes:
      - application/json
      parameters:
      - description: Roadmap id
        in: path
        name: id
        required: true
        type: integer
      - description: Roadmap fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateRoadmapRequest'
