<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="system-ui, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="0.55" stop-color="#e879f9"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="aur1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.25"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3" cx="0.6" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" fill="#020617"/>
  <rect width="1200" height="760" fill="url(#aur1)"/>
  <rect width="1200" height="760" fill="url(#aur2)"/>
  <rect width="1200" height="760" fill="url(#aur3)"/>

  <rect x="0" y="0" width="1200" height="72" fill="#0f172a" opacity="0.85"/>
  <text x="48" y="46" font-size="24" font-weight="800" fill="#f8fafc">🎮 LevelUp</text>
  <text x="120" y="46" font-size="24" font-weight="800"><tspan fill="#818cf8">U</tspan><tspan fill="#e879f9">p</tspan></text>
  <text x="360" y="46" font-size="15" fill="#cbd5e1" font-weight="600">Возможности</text>
  <text x="480" y="46" font-size="15" fill="#cbd5e1" font-weight="600">Как это работает</text>
  <rect x="880" y="22" width="64" height="28" rx="14" fill="#1e293b"/>
  <rect x="884" y="26" width="20" height="20" rx="10" fill="#f59e0b"/>
  <rect x="1000" y="18" width="152" height="36" rx="18" fill="url(#btn)"/>
  <text x="1076" y="41" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Открыть приложение</text>

  <rect x="470" y="110" width="260" height="30" rx="15" fill="#312e81"/>
  <text x="600" y="130" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">🎮 RPG-трекер задач</text>

  <text x="600" y="200" font-size="56" font-weight="900" fill="#f8fafc" text-anchor="middle">Превратите задачи в</text>
  <text x="600" y="266" font-size="56" font-weight="900" text-anchor="middle">
    <tspan fill="url(#brand)">квесты</tspan><tspan fill="#f8fafc">, а прогресс — в </tspan><tspan fill="url(#brand)">игру</tspan>
  </text>

  <text x="600" y="316" font-size="19" fill="#94a3b8" text-anchor="middle">Ветки, квесты с наградами, роадмапы-графы, магазин и воркшоп.</text>
  <text x="600" y="342" font-size="19" fill="#94a3b8" text-anchor="middle">Прокачивайте уровень за реальные достижения.</text>

  <rect x="470" y="376" width="140" height="46" rx="14" fill="url(#btn)"/>
  <text x="540" y="404" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Начать бесплатно</text>
  <rect x="626" y="376" width="140" height="46" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="696" y="404" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">Личный кабинет</text>

  <rect x="180" y="452" width="840" height="272" rx="24" fill="#0f172a" opacity="0.9" stroke="#1e293b"/>
  <text x="600" y="492" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">Схема роадмапы</text>

  <path d="M 480 640 C 545 640, 560 640, 620 640" fill="none" stroke="#6366f1" stroke-width="3"/>
  <path d="M 480 555 C 545 555, 560 555, 620 555" fill="none" stroke="#6366f1" stroke-width="3"/>
  <path d="M 760 598 C 830 598, 845 598, 905 598" fill="none" stroke="#6366f1" stroke-width="3"/>

  <g>
    <rect x="330" y="520" width="150" height="70" rx="16" fill="#6366f1"/>
    <text x="405" y="560" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Основы</text>
  </g>
  <g>
    <rect x="330" y="605" width="150" height="70" rx="16" fill="#8b5cf6"/>
    <text x="405" y="645" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Практика</text>
  </g>
  <g>
    <rect x="620" y="563" width="140" height="70" rx="16" fill="#a855f7"/>
    <text x="690" y="603" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Проект</text>
  </g>
  <g>
    <rect x="905" y="563" width="90" height="70" rx="16" fill="#d946ef"/>
    <text x="950" y="603" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">MVP</text>
