version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - gocritic
    - godot
    - gosec
    - revive
    - misspell
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocyclo

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/north-fy/levelup